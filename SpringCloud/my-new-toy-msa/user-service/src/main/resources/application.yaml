
spring:
  application:
    name: my-user-service
  h2:
    console:
      path: /h2-console
      enabled: true
      settings:
        web-allow-others: true
#  datasource:
#    driver-class-name: org.h2.Driver
#    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;
#    username: sa
#    password:
  jpa:
    hibernate:
      ddl-auto: update
  security:
    user:
      name: user
      password: $2a$10$GFLcqQxg1Isyw17LAF5Mf.SGXZEDqG1pKIwi1V5EB4QJwtLyjWFiG
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest
server:
  port: 0
eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://127.0.0.1:8761/eureka
  instance:
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}

greeting:
  message: Welcome to the Simple E-Commerce (Spring Boot)

token:
  secret: my-very-long-secret-key-1234567890
  expiration-time: 300000 # 5 minutes

management:
  endpoints:
    web:
      exposure:
        include:
          - refresh
          - health
          - beans
          - httptrace
          - info
          - busrefresh
          - metrics
          - prometheus
  tracing:
    sampling:
      probability: 1.0
    propagation:
      consume: b3
      produce: b3_multi
  zipkin:
    tracing:
      endpoint: "http://localhost:9411/api/v2/spans"
logging:
  level:
    com.example.userservice.client : DEBUG
#  pattern:
#    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

